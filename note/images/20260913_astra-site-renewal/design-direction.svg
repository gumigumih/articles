    <g font-size="14" fill="#64748b"><text x="106" y="1002">画面設計から、使えるUIまで。</text><text x="449" y="1002">APIやデータ処理を、必要な範囲で。</text><text x="792" y="1002">チームの中に入り、前へ進めます。</text></g>

