<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">meg+gumi redesign direction</title>
  <desc id="desc">A vertical website mockup with strong Japanese typography, a fine grid, slate colors, pink and amber accents, services and works sections.</desc>
  <defs>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#667386"/><stop offset="1" stop-color="#445062"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f18aba"/><stop offset="1" stop-color="#e764a5"/></linearGradient>
  </defs>
  <rect width="1200" height="1800" fill="#fff"/>
  <rect x="34" y="34" width="1132" height="1732" rx="4" fill="#fff" stroke="#d7dde4" stroke-width="2"/>
