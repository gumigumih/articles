<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Notion DB モデル終了・移行の実データ抜粋</title>
  <desc id="desc">モデル名、提供サービス、モデルID、状態、終了予定日、移行期限、最終確認日を並べたNotionデータベースの実データ抜粋。</desc>
  <style>
    .title{font:700 30px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#1f2933}
    .caption{font:16px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#52606d}
    .head{font:700 16px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#52606d}
    .cell{font:15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#1f2933}
    .small{font:13px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#52606d}
  </style>
  <rect width="1600" height="760" fill="#f7f9fb"/>
  <text x="60" y="58" class="title">Notion DB「モデル終了・移行」</text>
  <text x="60" y="88" class="caption">実際のDBから、判断に使う列と行を抜粋（確認日：2026-11-01）</text>
  <rect x="60" y="125" width="1480" height="54" rx="8" fill="#e8eef5"/>
  <text x="80" y="159" class="head">名前</text>
  <text x="400" y="159" class="head">提供サービス</text>
  <text x="650" y="159" class="head">モデルID</text>
  <text x="925" y="159" class="head">状態</text>
  <text x="1045" y="159" class="head">終了予定日</text>
  <text x="1195" y="159" class="head">移行期限</text>
  <text x="1345" y="159" class="head">最終確認日</text>

  <g>
    <rect x="60" y="179" width="1480" height="82" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="80" y="216" class="cell">xAI / Google Cloud Agent Platform｜grok-4.7</text><text x="400" y="216" class="cell">Vertex AI / Agent Platform</text><text x="650" y="216" class="cell">grok-4.7</text><rect x="925" y="197" width="66" height="28" rx="14" fill="#d9f2e6"/><text x="958" y="216" text-anchor="middle" class="small">提供中</text><text x="1045" y="216" class="cell">—</text><text x="1195" y="216" class="cell">—</text><text x="1345" y="216" class="cell">2026-10-31</text>
  </g>
  <g>
    <rect x="60" y="261" width="1480" height="82" fill="#fffaf1" stroke="#d9e2ec"/>
    <text x="80" y="298" class="cell">Claude Opus 4.8｜fast modeのみ11/30終了予定</text><text x="400" y="298" class="cell">Claude API</text><text x="650" y="298" class="cell">claude-opus-4-8</text><rect x="925" y="279" width="66" height="28" rx="14" fill="#ffe2b8"/><text x="958" y="298" text-anchor="middle" class="small">終了予定</text><text x="1045" y="298" class="cell">2026-11-30</text><text x="1195" y="298" class="cell">2026-11-30</text><text x="1345" y="298" class="cell">2026-10-31</text>
  </g>
  <g>
    <rect x="60" y="343" width="1480" height="82" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="80" y="380" class="cell">OpenAI / API｜gpt-6.1-terra</text><text x="400" y="380" class="cell">OpenAI API</text><text x="650" y="380" class="cell">gpt-6.1-terra</text><rect x="925" y="361" width="66" height="28" rx="14" fill="#d9f2e6"/><text x="958" y="380" text-anchor="middle" class="small">提供中</text><text x="1045" y="380" class="cell">—</text><text x="1195" y="380" class="cell">—</text><text x="1345" y="380" class="cell">2026-10-27</text>
  </g>
  <g>
    <rect x="60" y="425" width="1480" height="82" fill="#fffaf1" stroke="#d9e2ec"/>
    <text x="80" y="462" class="cell">Google Cloud Model Garden：GPT-6.1 Sol</text><text x="400" y="462" class="cell">Vertex AI / Agent Platform</text><text x="650" y="462" class="cell">未確認</text><rect x="925" y="443" width="66" height="28" rx="14" fill="#fff1b8"/><text x="958" y="462" text-anchor="middle" class="small">Preview</text><text x="1045" y="462" class="cell">—</text><text x="1195" y="462" class="cell">—</text><text x="1345" y="462" class="cell">2026-10-22</text>
  </g>
  <g>
    <rect x="60" y="507" width="1480" height="82" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="80" y="544" class="cell">Google Cloud（Anthropic managed）｜claude-opus-5-5</text><text x="400" y="544" class="cell">Claude Models on Google Cloud</text><text x="650" y="544" class="cell">claude-opus-5-5</text><rect x="925" y="525" width="66" height="28" rx="14" fill="#d9f2e6"/><text x="958" y="544" text-anchor="middle" class="small">提供中</text><text x="1045" y="544" class="cell">—</text><text x="1195" y="544" class="cell">2027-09-22</text><text x="1345" y="544" class="cell">2026-10-23</text>
  </g>
  <text x="60" y="650" class="caption">※「提供中」「Preview」「終了予定」は、Notion上の状態。終了日や移行期限が空欄でも、終了しないと断定するための表示ではありません。</text>
  <text x="60" y="680" class="caption">※実際のDBには、公式URL、提供条件・注意点、判断区分、対応状況、本人該当性などの列もあります。</text>
</svg>
